<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My E-Commerce Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
}

header{
    background:#222;
    color:white;
    padding:15px;
    text-align:center;
}

.categories{
    display:flex;
    justify-content:center;
    gap:15px;
    padding:15px;
    flex-wrap:wrap;
}

.categories button{
    padding:10px 20px;
    border:none;
    background:#007bff;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

.categories button:hover{
    background:#0056b3;
}

.container{
    width:90%;
    margin:auto;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:20px;
}

.product{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    text-align:center;
}

.product img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:8px;
}

.product h3{
    margin:10px 0;
}

.price{
    color:green;
    font-size:20px;
    margin:10px 0;
}

.btn{
    padding:10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin:5px;
}

.cart-btn{
    background:#28a745;
    color:white;
}

.buy-btn{
    background:#ff9800;
    color:white;
}

.cart-section{
    background:white;
    margin-top:30px;
    padding:20px;
    border-radius:10px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #ddd;
}

.remove-btn{
    background:red;
    color:white;
    border:none;
    padding:5px 10px;
    border-radius:5px;
    cursor:pointer;
}

.cancel-btn{
    background:#dc3545;
    color:white;
    padding:10px 15px;
    border:none;
    border-radius:5px;
    margin-top:15px;
    cursor:pointer;
}

.checkout-btn{
    background:#28a745;
    color:white;
    padding:10px 15px;
    border:none;
    border-radius:5px;
    margin-top:15px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
    <h1>🛒JIO MART </h1>
</header>

<div class="categories">
    <button onclick="filterProducts('all')">All</button>
    <button onclick="filterProducts('Electronics')">Electronics</button>
    <button onclick="filterProducts('Fashion')">Fashion</button>
    <button onclick="filterProducts('Shoes')">Shoes</button>
</div>

<div class="container">

    <div class="products" id="productList"></div>

    <div class="cart-section">
        <h2>Shopping Cart</h2>
        <div id="cartItems"></div>
        <h3>Total: ₹<span id="total">0</span></h3>

        <button class="checkout-btn" onclick="buyProducts()">
            Buy Now
        </button>

        <button class="cancel-btn" onclick="cancelOrder()">
            Cancel Order
        </button>
    </div>

</div>

<script>

const products = [
{
    id:1,
    name:"Smartphone",
    category:"Electronics",
    price:19999,
    image:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9"
},
{
    id:2,
    name:"Laptop",
    category:"Electronics",
    price:54999,
    image:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853"
},
{
    id:3,
    name:"Men's Jacket",
    category:"Fashion",
    price:2499,
    image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab"
},
{
    id:4,
    name:"Running Shoes",
    category:"Shoes",
    price:3499,
    image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff"
}
];

let cart = [];

function displayProducts(productArray){
    const productList = document.getElementById("productList");

    productList.innerHTML = productArray.map(product => `
        <div class="product">
            <img src="${product.image}" alt="${product.name}">
            <h3>${product.name}</h3>
            <p>Category: ${product.category}</p>
            <p class="price">₹${product.price}</p>

            <button class="btn cart-btn"
                onclick="addToCart(${product.id})">
                Add to Cart
            </button>

            <button class="btn buy-btn"
                onclick="buySingle('${product.name}')">
                Buy Now
            </button>
        </div>
    `).join('');
}

function filterProducts(category){
    if(category === "all"){
        displayProducts(products);
    }else{
        displayProducts(
            products.filter(p => p.category === category)
        );
    }
}

function addToCart(id){
    const product = products.find(p => p.id === id);
    cart.push(product);
    updateCart();
}

function removeFromCart(index){
    cart.splice(index,1);
    updateCart();
}

function updateCart(){

    const cartItems = document.getElementById("cartItems");
    let total = 0;

    cartItems.innerHTML = "";

    cart.forEach((item,index)=>{

        total += item.price;

        cartItems.innerHTML += `
        <div class="cart-item">
            <span>${item.name} - ₹${item.price}</span>

            <button class="remove-btn"
                onclick="removeFromCart(${index})">
                Remove
            </button>
        </div>
        `;
    });

    document.getElementById("total").innerText = total;
}

function buySingle(productName){
    alert("Order placed for: " + productName);
}

function buyProducts(){

    if(cart.length === 0){
        alert("Cart is empty!");
        return;
    }

    alert("Purchase Successful!");
    cart = [];
    updateCart();
}

function cancelOrder(){

    if(cart.length === 0){
        alert("No order to cancel.");
        return;
    }

    cart = [];
    updateCart();

    alert("Order Cancelled Successfully.");
}

displayProducts(products);

</script>

</body>
</html>
